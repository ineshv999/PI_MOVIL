events {}

http {

    upstream sga_api {

        least_conn;

        server sga-api-private-1:10000 max_fails=3 fail_timeout=30s;
        server sga-api-private-2:10000 max_fails=3 fail_timeout=30s;

    }

    server {

        listen 10000;

        location /docs {
            return 404;
        }

        location /redoc {
            return 404;
        }

        location /openapi.json {
            return 404;
        }

        location /metrics {
            return 404;
        }

        location / {

            proxy_pass http://sga_api;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;

        }
    }
}