global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s

# Resolver DNS para la red privada de Render
resolvers render_dns
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend api_gateway
    bind *:10000

    # Bloquear Swagger y métricas
    acl docs path_beg /docs
    acl redoc path_beg /redoc
    acl openapi path /openapi.json
    acl metrics path_beg /metrics

    http-request deny if docs
    http-request deny if redoc
    http-request deny if openapi
    http-request deny if metrics

    default_backend sga_backend

backend sga_backend
    balance roundrobin

    option httpchk GET /api/v1/health
    http-check expect status 200

    server api1 sga-api-private-1:10000 check resolvers render_dns init-addr none
    server api2 sga-api-private-2:10000 check resolvers render_dns init-addr none
